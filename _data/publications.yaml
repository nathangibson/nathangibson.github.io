- id: gibsonMidNinthCenturyArabicTranslation2017
  abstract: >-
    One of the earliest Muslim authors to make use of biblical material
    translated into Arabic was ʿAmr b. Baḥr al-Jāḥiẓ (d. 868/9), who in his
    “Refutation of Christians” (Al-Radd ʿalā al-Naṣārā), attempts to discredit
    Jewish Arabic translations of the Old Testament as a source for Christian
    arguments that Jesus was the Son of God. His position assumes two
    distinctive points regarding scriptural texts: (1) that the text of the
    extant Hebrew Bible was trustworthy but that the Christian Gospels were not,
    and (2) that the anthropomorphizing content of existing Jewish versions
    resulted from poor translation. 


    Research into al-Jāḥiẓ’s text so far has explored its discussion of
    anthropomorphism and its potential impact on Saʿadya Gaon’s Bible
    translation of the Hebrew Bible, but has left open the translation source of
    the longest passage al-Jāḥiẓ quotes, Isaiah 42:10–16. Although it has
    earlier been suggested that the translation of this passage ultimately stems
    from the Peshiṭṭa Syriac version, this study compares al-Jāḥiẓ’s text to the
    Hebrew, Syriac, and other versions, and demonstrates that the cited
    translation must have been made from the Hebrew. It also examines the
    translation techniques observable in the passage, showing a more
    Arabo-centric approach than typically attested in early non-Saʿadyanic
    versions. The study concludes (1) that as a Muslim polemicist, al-Jāḥiẓ had
    real contact with the Jewish community and its texts, and (2) that his
    quotation evidences a pre-Saʿadyanic attempt to translate the Bible from
    Hebrew into Arabic using a less literal approach than is previously
    attested.
