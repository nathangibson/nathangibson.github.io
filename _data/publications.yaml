- id: gibsonModelingBodyLiterature2016
  abstract: >-
    The Syriaca.org project publishes born-digital reference works in TEI.
    Bibliotheca Hagiographica Syriaca Electronica [http://syriaca.org/bhse] is a
    set of metadata records describing a particular genre of Middle Eastern
    literature: saints’ lives written in the Syriac language. This poster
    describes (1) the process of transforming a legacy (tabular) dataset into
    TEI and (2) the decisions made in creating a schema for encoding and
    modeling metadata about a body of literature. Syriaca.org is now revising
    this TEI schema for an expanded project which will describe all of Syriac
    literature, a corpus which has had little previous scholarly classification
    or description. 


    Syriaca.org considered a number of methodological questions which arose from
    using TEI to model “works” (in the sense defined by FRBR
    [http://archive.ifla.org/VII/s13/frbr/frbr_current3.htm#3.2]). While TEI is
    frequently used to represent the content of specific manuscripts (or other
    text-bearing objects) and create editions of works, we found that the use of
    TEI for born-digital metadata records was less common. We found a number of
    advantages in using TEI over other metadata or bibliographic formats (e.g.
    MARC, Dublin Core). In addition, we made encoding decisions about how to
    apply the TEI guidelines to the following questions:

    How can TEI model relationships among works, especially different recensions
    of the same work or whole-to-part relationships?

    How can TEI express the relationships of works to their manuscript
    witnesses, editions, and translations?

    How can TEI express the relationship of works to persons with alleged
    authorial or editorial responsibility for it, whether genuine, pseudonymous,
    anonymous, or attributed?

    This poster presents our preliminary schema for modeling a body of
    literature in TEI, for which the authors actively seek feedback,
    suggestions, and criticism. We are particularly interested in learning from
    similar projects which have used TEI to map or model metadata about large
    and heterogenous literary canons.
