- id: goetheuniversitaetNewlyAppointedProf2024
  abstract: >-
    Prof. Dr.  Nathan Gibson is Professor of Religious Studies with a focus on
    Jewish-Islamic relations at the Faculty of Protestant Theology since March
    2023. His research focuses on the social dimensions of interreligious
    exchange, be it in relation to historic scientific cooperation, theological
    argumentation or scriptural traditions. In this context, he is actively
    involved in the use of digital tools for analysing and presenting humanities
    data.


    Neuberufen: Prof. Dr. Nathan Gibson, Professor für Religionswissenschaft /
    Prof. Dr. Nathan Gibson ist seit März 2023 Professor für
    Religionswissenschaft mit dem Schwerpunkt jüdisch-islamische Beziehungen am
    Fachbereich Evangelische Theologie. Sein Forschungsschwerpunkt liegt auf den
    sozialen Dimensionen des interreligiösen Austauschs, sei es in Bezug auf die
    historisch-wissenschaftliche Zusammenarbeit, die theologische Argumentation
    oder die Schrifttraditionen. In diesem Zusammenhang befasst er sich aktiv
    mit dem Einsatz digitaler Werkzeuge für die Analyse und Darstellung
    geisteswissenschaftlicher Daten.
