- id: gibsonLabelingReligiousAffiliation2020
  abstract: >-
    The biographical dictionary of Ibn Abī Uṣaybiʿa (1203–1270 AD), titled The
    Best Accounts of the Classes of Physicians (Arabic, ʿUyūn al-anbāʾ fī
    ṭabaqāt al-aṭibbāʾ) or History of Physicians for short, is perhaps unequaled
    in the extent to which it details the social interactions of scholars from
    many different religious communities. Ṭabaqāt literature in general tends to
    provide a kind of Who’s-Who resource collecting information about personages
    in particular categories, such as hadith transmitters or poets. Normally
    authors tended to make these categories applicable to a certain religious
    tradition, but Ibn Abī Uṣaybiʿa’s project broke the mold by outlining a
    profession (medicine and related areas) in which collaboration and exchange
    among communities was typical. The History of Physicians is thus an ideal
    target for large-scale analysis of interreligious exchange, as the project
    “Communities of Knowledge” is in the process of doing.


    Nevertheless, incorporating “religious affiliation” as a factor in analyzing
    Ibn Abī Uṣaybiʿa’s text is fraught with complexity. First is the looming
    issue of what religion even means in this context. Second is the question of
    which terms or phrases the author uses to intentionally signal a particular
    affiliation. Third, which other characteristics may be taken to indicate
    religious affiliation, as perhaps certain titles, professions, actions, or
    (very cautiously) names? Finally, what should be done with mixed
    indications, whether these are due to inaccurate sources, ambiguous
    affiliation, or conversion?


    I will present a case for recording these textual indications using the
    prosopographical tool of “factoids,” which can support a more nuanced
    analysis than simply recording a single affiliation for each person. Each
    factoid, representing an assertion by Ibn Abī Uṣaybiʿa or his sources, is
    one of several markers of religious affiliation, which may point toward
    different affiliations for the same person. The strength of these markers
    and their agreement or variance for a particular person provide specific
    data points that can be used to reconstruct networks of communities while
    also allowing for alternate scenarios.


    The “Communities of Knowledge” project is funded by the “Kleine Fächer –
    Große Potentiale” program of the German Federal Ministry of Research and
    Education, 2018–2021.
