- id: gibsonClosestFriendshipAlJahiz2015
  abstract: >-
    Abbasid society in ninth-century Iraq faced the challenge of reconciling the
    role of its many non-Muslim citizens with Islamic norms and governance, as
    seen in ¿The Refutation of Christians¿ by al-Jahiz (d. 868/869 [255 A.H.]).
    Al-Jahiz moved in circles only one step removed from those of the Christian
    and Jewish intellectuals he came to criticize in the work, and he likely
    composed it just prior to Caliph al-Mutawakkil¿s watershed reforms in
    non-Muslim policy. Thus, the ¿Refutation¿ is a primary source for
    understanding shifting Muslim sensibilities toward Christians¿ societal role
    in a religiously diverse realm, but its polemic approach makes it
    problematic to analyze historically. This dissertation seeks to make ¿The
    Refutation of Christians¿ more accessible as a historical source by
    performing a contextual analysis of its argumentation. Al-Jahiz¿ rhetorical
    strategy is to explain away factors behind popular Muslim preferences for
    Christians over Jews, and then to advance positive reasons for considering
    Christians more harmful than Jews. Argumentation analysis using the
    pragma-dialectical approach highlights salient social points at issue
    between Christians and Muslims of the time. First, al-Jahiz¿ dispute is not
    directly with Christians, but with Muslims who show them too much respect
    and liberality. Second, he must reframe certain facts about Christians that
    are too generally accepted to contradict, including memories of Arabs¿
    pre-Islamic and early Islamic contacts with Christians, and Christian
    intellectuals¿ crucial role in perpetuating Greek scientific works. He turns
    these favorable perceptions into liabilities, arguing that Christians¿
    intellectualism diverts weak Muslims from the faith and their social
    position violates Christian-Muslim agreements. Finally, in contrast to the
    jurists¿ approach, he argues for enforcing the original intention of these
    agreements rather than trying to demonstrate specific historical
    stipulations. Al-Jahiz¿ ideology aligns with al-Mutawakkil¿s Qur'anically
    charged edicts, in that Christians, far from being ¿closest in friendship¿
    (5:82), are those with whom believers must not make any alliance (5:51). As
    such, the ¿Refutation¿ reveals the battle lines between more lenient,
    popular Muslim attitudes and a stricter position promoted by al-Jahiz and
    enforced by al-Mutawakkil.
