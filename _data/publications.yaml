- id: gibsonManuscriptCataloguesHandbook17
  abstract: >-
    Despite increasing interest in Syriac studies and growing digital
    availability of Syriac texts, there is currently no up-to-date
    infrastructure for discovering, identifying, classifying, and referencing
    works of Syriac literature. The standard reference work (Baumstark's
    Geschichte) is over ninety years old, and the perhaps 20,000 Syriac
    manuscripts extant worldwide can be accessed only through disparate
    catalogues and databases. The present article proposes a tentative data
    model for Syriaca.org's New Handbook of Syriac Literature, an open-access
    digital publication that will serve as both an authority file for Syriac
    works and a guide to accessing their manuscript representations, editions,
    and translations. The authors hope that by publishing a draft data model
    they can receive feedback and incorporate suggestions into the next stage of
    the project.
