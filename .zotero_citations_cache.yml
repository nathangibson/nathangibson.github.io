gibsonLabelingReligiousAffiliation2020:
  chicago-bibliography: 'Gibson, Nathan P. |BEGIN_TITLE|“Labeling Religious Affiliation
    in Ibn Abī Uṣaybiʿa’s History of Physicians: A Quest”|END_TITLE|. Jews, Christians,
    and Muslims as Colleagues and Collaborators in the Abbasid Near East, December
    11, 2020. https://tinyurl.com/gibson201211.'
  coins: url_ver=Z39.88-2004&amp;ctx_ver=Z39.88-2004&amp;rfr_id=info%3Asid%2Fzotero.org%3A2&amp;rft_val_fmt=info%3Aofi%2Ffmt%3Akev%3Amtx%3Adc&amp;rft.type=presentation&amp;rft.title=Labeling%20Religious%20Affiliation%20in%20Ibn%20Ab%C4%AB%20U%E1%B9%A3aybi%CA%BFa&apos;s%20History%20of%20Physicians%3A%20A%20Quest&amp;rft.description=The%20biographical%20dictionary%20of%20Ibn%20Ab%C4%AB%20U%E1%B9%A3aybi%CA%BFa%20(1203%E2%80%931270%20AD)%2C%20titled%20The%20Best%20Accounts%20of%20the%20Classes%20of%20Physicians%20(Arabic%2C%20%CA%BFUy%C5%ABn%20al-anb%C4%81%CA%BE%20f%C4%AB%20%E1%B9%ADabaq%C4%81t%20al-a%E1%B9%ADibb%C4%81%CA%BE)%20or%20History%20of%20Physicians%20for%20short%2C%20is%20perhaps%20unequaled%20in%20the%20extent%20to%20which%20it%20details%20the%20social%20interactions%20of%20scholars%20from%20many%20different%20religious%20communities.%20%E1%B9%ACabaq%C4%81t%20literature%20in%20general%20tends%20to%20provide%20a%20kind%20of%20Who%E2%80%99s-Who%20resource%20collecting%20information%20about%20personages%20in%20particular%20categories%2C%20such%20as%20hadith%20transmitters%20or%20poets.%20Normally%20authors%20tended%20to%20make%20these%20categories%20applicable%20to%20a%20certain%20religious%20tradition%2C%20but%20Ibn%20Ab%C4%AB%20U%E1%B9%A3aybi%CA%BFa%E2%80%99s%20project%20broke%20the%20mold%20by%20outlining%20a%20profession%20(medicine%20and%20related%20areas)%20in%20which%20collaboration%20and%20exchange%20among%20communities%20was%20typical.%20The%20History%20of%20Physicians%20is%20thus%20an%20ideal%20target%20for%20large-scale%20analysis%20of%20interreligious%20exchange%2C%20as%20the%20project%20%E2%80%9CCommunities%20of%20Knowledge%E2%80%9D%20is%20in%20the%20process%20of%20doing.%0A%0ANevertheless%2C%20incorporating%20%E2%80%9Creligious%20affiliation%E2%80%9D%20as%20a%20factor%20in%20analyzing%20Ibn%20Ab%C4%AB%20U%E1%B9%A3aybi%CA%BFa%E2%80%99s%20text%20is%20fraught%20with%20complexity.%20First%20is%20the%20looming%20issue%20of%20what%20religion%20even%20means%20in%20this%20context.%20Second%20is%20the%20question%20of%20which%20terms%20or%20phrases%20the%20author%20uses%20to%20intentionally%20signal%20a%20particular%20affiliation.%20Third%2C%20which%20other%20characteristics%20may%20be%20taken%20to%20indicate%20religious%20affiliation%2C%20as%20perhaps%20certain%20titles%2C%20professions%2C%20actions%2C%20or%20(very%20cautiously)%20names%3F%20Finally%2C%20what%20should%20be%20done%20with%20mixed%20indications%2C%20whether%20these%20are%20due%20to%20inaccurate%20sources%2C%20ambiguous%20affiliation%2C%20or%20conversion%3F%0A%0AI%20will%20present%20a%20case%20for%20recording%20these%20textual%20indications%20using%20the%20prosopographical%20tool%20of%20%E2%80%9Cfactoids%2C%E2%80%9D%20which%20can%20support%20a%20more%20nuanced%20analysis%20than%20simply%20recording%20a%20single%20affiliation%20for%20each%20person.%20Each%20factoid%2C%20representing%20an%20assertion%20by%20Ibn%20Ab%C4%AB%20U%E1%B9%A3aybi%CA%BFa%20or%20his%20sources%2C%20is%20one%20of%20several%20markers%20of%20religious%20affiliation%2C%20which%20may%20point%20toward%20different%20affiliations%20for%20the%20same%20person.%20The%20strength%20of%20these%20markers%20and%20their%20agreement%20or%20variance%20for%20a%20particular%20person%20provide%20specific%20data%20points%20that%20can%20be%20used%20to%20reconstruct%20networks%20of%20communities%20while%20also%20allowing%20for%20alternate%20scenarios.%0A%0AThe%20%E2%80%9CCommunities%20of%20Knowledge%E2%80%9D%20project%20is%20funded%20by%20the%20%E2%80%9CKleine%20F%C3%A4cher%20%E2%80%93%20Gro%C3%9Fe%20Potentiale%E2%80%9D%20program%20of%20the%20German%20Federal%20Ministry%20of%20Research%20and%20Education%2C%202018%E2%80%932021.&amp;rft.identifier=https%3A%2F%2Ftinyurl.com%2Fgibson201211&amp;rft.aufirst=Nathan%20P.&amp;rft.aulast=Gibson&amp;rft.au=Nathan%20P.%20Gibson&amp;rft.date=2020-12-11&amp;rft.language=en
