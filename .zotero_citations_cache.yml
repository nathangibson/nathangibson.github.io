  coins: url_ver=Z39.88-2004&amp;ctx_ver=Z39.88-2004&amp;rfr_id=info%3Asid%2Fzotero.org%3A2&amp;rft_id=info%3Adoi%2F10.5281%2Fzenodo.3452744&amp;rft_val_fmt=info%3Aofi%2Ffmt%3Akev%3Amtx%3Adc&amp;rft.type=presentation&amp;rft.title=Five%20Centuries%20of%20History%20in%20a%20Network&amp;rft.description=How%20should%20historical%20researchers%20encode%20texts%20that%20will%20be%20used%20as%20primary%20sources%20for%20network%20analysis%3F%20Moreover%2C%20how%20can%20they%20link%20together%20the%20various%20layers%20of%20this%20encoding%20in%20a%20way%20that%20explicitly%20shows%20the%20encoder%E2%80%99s%20methodology%20and%20interpretations%3F%20This%20presentation%20is%20intended%20to%20demonstrate%20and%20solicit%20feedback%20on%20an%20experimental%20procedure%20applicable%20to%20projects%20producing%20networks%20from%20historiographical%20texts.%20The%20project%20%E2%80%9CCommunities%20of%20Knowledge%3A%20Interreligious%20Networks%20of%20Scholars%20in%20Ibn%20Abi%20Usaybi%CA%BFa%E2%80%99s%20History%20of%20the%20Physicians%E2%80%9D%20(https%3A%2F%2Fusaybia.net)%20is%20conducting%20a%20network%20analysis%20of%20interactions%20among%20Muslim%2C%20Christian%2C%20and%20Jewish%20scholars%20across%20five%20centuries%20of%20Abbasid%20rule%20in%20the%20Near%20East%20(750%E2%80%931258).%20The%20primary%20source%20text%20for%20this%20endeavor%20is%20an%20Arabic%20biographical%20dictionary%20written%20by%20Ibn%20Abi%20Usaybi%CA%BFa%2C%20a%20physician%20active%20in%20Cairo%20and%20Damascus%20in%20the%2013th%20century.%20This%20History%20of%20Physicians%20details%20teacher-student%20relations%2C%20workplace%20exchanges%2C%20correspondence%2C%20oral%20reports%2C%20and%20other%20interactions%20among%20the%20scholars%20mentioned.%20The%20network%20analysis%20based%20on%20this%20historiographical%20text%20requires%20a%20way%20to%20proceed%20from%20encoding%20a%20source%20text%20in%20TEI%20to%20producing%20a%20dataset%20for%20network%20analysis.%20Along%20the%20way%2C%20it%20must%20document%20at%20least%20two%20layers%20of%20interpretation%3A%20(1)%20the%20primary%20source%20author%E2%80%99s%20portrayal%20of%20events%20and%20(2)%20the%20researcher%E2%80%99s%20own%20understanding%20of%20these%20assertions.%20One%20way%20to%20make%20these%20interpretive%20layers%20explicit%20is%20to%20isolate%20individual%20%E2%80%9Cfactoids%E2%80%9D%20as%20analytical%20units.%20Encoding%20factoids%20in%20TEI%20and%20RDF%20has%20been%20recently%20pioneered%20by%20Daniel%20L.%20Schwartz%20for%20the%20Syriaca.org%20project%20%E2%80%9CSPEAR%3A%20Syriac%20Persons%2C%20Events%2C%20and%20Relationships.%E2%80%9D%20The%20current%20project%20extends%20this%20by%20producing%20factoids%20directly%20from%20a%20primary%20source%20and%20integrating%20them%20into%20the%20encoded%20text%2C%20as%20well%20as%20by%20further%20refining%20the%20process%20of%20curating%20resulting%20factoids%20into%20nodes%20and%20edges%20for%20network%20analysis.&amp;rft.identifier=urn%3Adoi%3A10.5281%2Fzenodo.3452744&amp;rft.aufirst=Nathan%20P.&amp;rft.aulast=Gibson&amp;rft.au=Nathan%20P.%20Gibson&amp;rft.date=2019-09-20&amp;rft.language=en
