gibsonFiveCenturiesHistory2019:
  chicago-bibliography: Gibson, Nathan P. |BEGIN_TITLE|“Five Centuries of History
    in a Network.”|END_TITLE| What is Text, Really? TEI and Beyond (TEI Conference
