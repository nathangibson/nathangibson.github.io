  coins: url_ver=Z39.88-2004&amp;ctx_ver=Z39.88-2004&amp;rfr_id=info%3Asid%2Fzotero.org%3A2&amp;rft_id=info%3Adoi%2F10.5281%2Fzenodo.6539718&amp;rft_val_fmt=info%3Aofi%2Ffmt%3Akev%3Amtx%3Adc&amp;rft.type=presentation&amp;rft.title=Modeling%20a%20Born-Digital%20Factoid%20Prosopography%20using%20the%20TEI%20and%20Linked%20Data&amp;rft.description=Although%20the%20TEI%20has%20traditionally%20been%20used%20for%20encoding%20text%2C%20its%20combination%20of%20structured%20and%20semi-structured%20data%20has%20made%20it%20a%20compelling%20choice%20for%20born-digital%2C%20linked-data%20resources%20as%20well.%20Our%20intent%20here%20is%20to%20demonstrate%20the%20advantages%20it%20offers%20for%20digital%20prosopographies%20along%20with%20a%20model%20that%20can%20be%20used%20for%20them.%20Syriac%20Persons%2C%20Events%2C%20and%20Relations%20(SPEAR)%20is%20a%20born-digital%20prosopography%20project%20in%20the%20field%20of%20Syriac%20studies.%20Where%20traditional%20prosopographies%20focused%20on%20prose%20descriptions%20of%20individual%20persons%20of%20significance%2C%20SPEAR%20follows%20recent%20developments%20in%20research%20methodologies%20that%20instead%20produce%20prosopographical%20factoids.%20Factoids%20are%20structured%20data%20about%20persons%20drawn%20from%20the%20analysis%20of%20historical%20texts.%20Most%20factoid%20prosopographies%20use%20relational%20databases%20to%20model%20data.%20Instead%2C%20SPEAR%20uses%20a%20customized%20TEI%20schema%20to%20model%20factoids%20that%20can%20be%20queried%20and%20visualized%20in%20an%20XML%20database%20as%20well%20as%20serialized%20in%20HTML%20for%20human%20viewers%20and%20in%20RDF%20for%20data%20sharing.%20The%20TEI%E2%80%99s%20provisions%20for%20structured%20and%20semi-structured%20data%20make%20it%20ideal%20for%20encoding%20data%20from%20heterogeneous%20historical%20source%20material.%20Moreover%2C%20its%20linking%20capabilities%20connect%20SPEAR%20data%20to%20related%20data%20sets.%20By%20modeling%20prosopographical%20factoids%2C%20and%20not%20the%20source%20texts%20themselves%2C%20SPEAR%20offers%20an%20example%20of%20how%20a%20born-digital%2C%20data-oriented%20approach%20to%20using%20the%20TEI%20can%20circumvent%20some%20of%20the%20challenges%20posed%20by%20the%20tree%20structure%20of%20XML.%20It%20also%20disrupts%20traditional%20understandings%20of%C2%A0data%C2%A0and%C2%A0stand-off%20markup%C2%A0through%20combining%20linked%20open%20data%20approaches%20with%20the%20use%20of%20the%20TEI.&amp;rft.identifier=urn%3Adoi%3A10.5281%2Fzenodo.6539718&amp;rft.aufirst=Daniel%20L.&amp;rft.aulast=Schwartz&amp;rft.au=Daniel%20L.%20Schwartz&amp;rft.au=Nathan%20P.%20Gibson&amp;rft.au=Katayoun%20Torabi&amp;rft.date=2021-10-27&amp;rft.language=en
